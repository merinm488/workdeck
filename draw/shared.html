<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Draw - Shared Drawing</title>
    <meta name="description" content="View a shared drawing. Part of Workdeck.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#e11d48">

    <link rel="icon" type="image/svg+xml" href="/draw/icons/draw_icon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fabric.js — shared.js renders the drawing's objects onto a plain
         fabric.StaticCanvas here (read-only, no editing). -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@7/dist/index.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Public header: no session needed — anyone with the link can view -->
    <nav class="top-nav">
        <div class="top-nav-left">
            <img src="/draw/icons/draw_icon.svg" alt="" width="26" height="26"
                 style="border-radius: 6px;">
            <span id="sharedDrawingName" class="shared-drawing-name">Shared Drawing</span>
        </div>
        <div class="top-nav-right">
            <a class="present-btn" href="/" title="Made with Workdeck">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9.5 12 3l9 6.5"></path>
                    <path d="M5 8v12h14V8"></path>
                </svg>
                <span>Workdeck</span>
            </a>
        </div>
    </nav>

    <main class="shared-shell">
        <!-- Loading / error states (shared.js toggles .hidden) -->
        <div id="sharedLoading" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p>Loading drawing...</p>
        </div>
        <div id="sharedError" class="shared-state hidden">
            <h2>Drawing not found</h2>
            <p>This share link is invalid or the drawing is no longer shared.</p>
        </div>

        <!-- Read-only viewer: shared.js sizes #sharedSurface to the drawing's
             content bounds, fit to the window -->
        <div id="sharedStage" class="viewer-stage hidden">
            <div id="sharedSurface" class="drawing-surface">
                <canvas id="sharedCanvas"></canvas>
            </div>
        </div>

        <div id="viewerControls" class="viewer-controls hidden">
            <button id="viewerZoomOutBtn" class="viewer-ctrl-btn" aria-label="Zoom out" title="Zoom out">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </button>
            <button id="viewerFitBtn" class="viewer-ctrl-btn" aria-label="Fit to window" title="Fit to window">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
            <button id="viewerZoomInBtn" class="viewer-ctrl-btn" aria-label="Zoom in" title="Zoom in">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line><line x1="11" y1="8" x2="11" y2="14"></line>
                </svg>
            </button>
        </div>
    </main>

    <!-- Notification toast (shared.js showNotification writes here) -->
    <div id="notification" class="notification"></div>

    <!-- Load order: config -> storage (getSharedDrawing is public, no auth) -> shared -->
    <script src="config/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/shared.js"></script>
</body>
</html>
