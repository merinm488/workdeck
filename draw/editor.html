<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Draw - Drawing Editor</title>
    <meta name="description" content="Sketch freely on an infinite canvas with pencils, shapes, arrows, lines and text. Part of Workdeck.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#e11d48">

    <!-- App Icon (Draw rose) -->
    <link rel="icon" type="image/svg+xml" href="/draw/icons/draw_icon.svg">

    <!-- Inter Font (the default drawing font; load BEFORE fabric renders text
         so canvas text uses it — editor.js also awaits document.fonts.ready) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fabric.js (MIT, v7 browser build — exposes the global `fabric`).
         This is the drawing canvas engine: objects, transforms, freehand
         brushes, text editing, serialization (canvas.toObject() /
         canvas.loadFromJSON). Pinned major so minor upgrades are deliberate.
         NOTE: the dist-extensions bundle is NOT loaded — it is fabric's
         optional westures-based GESTURES package; the eraser is implemented
         in editor.js as object deletion because v7 ships no EraserBrush. -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@7/dist/index.min.js"></script>

    <!-- Custom CSS (after vendor sheets so app styles win the cascade) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ============================================================
         Top Navigation Bar
         ============================================================ -->
    <nav class="top-nav">
        <div class="top-nav-left">
            <button id="homeBtn" class="top-nav-btn" aria-label="Back to Workdeck" title="Back to Workdeck">
                <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <img src="/draw/icons/draw_icon.svg" alt="" width="24" height="24" style="border-radius: 6px;">
            <!-- editor.js: click -> openRenameModal(); rename PUTs updateDrawing -->
            <h1 id="drawingTitle" class="drawing-title" title="Click to rename">Untitled Drawing</h1>
            <!-- editor.js: "Saved · 12:04" / "Unsaved changes…" / "Saving…" -->
            <span id="saveState" class="save-state" aria-live="polite"></span>
        </div>

        <div class="top-nav-right">
            <div class="top-nav-actions">
                <!-- Export menu: editor.js wires exportPngBtn -->
                <div class="export-menu">
                    <button id="exportBtn" class="top-nav-btn top-nav-btn-wide" aria-haspopup="true" aria-expanded="false" title="Export">
                        <svg class="top-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Export</span>
                    </button>
                    <div id="exportDropdown" class="export-dropdown">
                        <button class="export-dropdown-item" id="exportPngBtn">
                            <span class="item-text">Drawing (.png)</span>
                        </button>
                    </div>
                </div>

                <button id="saveBtn" class="top-nav-btn" aria-label="Save Drawing" title="Save Drawing (Ctrl+S)">
                    <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                </button>
            </div>

            <div class="top-nav-settings">
                <button id="settingsBtn" class="top-nav-btn" aria-label="Settings">
                    <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <div id="settingsDropdown" class="settings-dropdown">
                    <div class="theme-dropdown-container">
                        <button class="settings-dropdown-item" id="themeToggleBtn">
                            <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <span class="item-text" id="themeText">Theme: Light</span>
                            <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                        <div class="theme-submenu" id="themeSubmenu">
                            <button class="theme-option" data-theme="light">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="5"></circle>
                                    <line x1="12" y1="1" x2="12" y2="3"></line>
                                    <line x1="12" y1="21" x2="12" y2="23"></line>
                                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                    <line x1="1" y1="12" x2="3" y2="12"></line>
                                    <line x1="21" y1="12" x2="23" y2="12"></line>
                                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                                </svg>
                                <span>Light</span>
                            </button>
                            <button class="theme-option" data-theme="dark">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                </svg>
                                <span>Dark</span>
                            </button>
                            <button class="theme-option" data-theme="system">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                    <line x1="8" y1="21" x2="16" y2="21"></line>
                                    <line x1="12" y1="17" x2="12" y2="21"></line>
                                </svg>
                                <span>System</span>
                            </button>
                        </div>
                    </div>
                    <button class="settings-dropdown-item" id="viewKeyBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                        <span class="item-text">View My Key</span>
                    </button>
                    <button class="settings-dropdown-item" id="shareBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        <span class="item-text">Share</span>
                    </button>
                    <div class="settings-dropdown-divider"></div>
                    <button class="settings-dropdown-item text-red-600" id="deleteAccountBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                        <span class="item-text">Delete Account</span>
                    </button>
                    <button class="settings-dropdown-item" id="logoutBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span class="item-text">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ============================================================
         Editor Shell — single infinite canvas + toolbar: the board IS
         the app.
         ============================================================ -->
    <div class="editor-shell editor-shell-full">
        <section class="stage-column">
            <!-- Toolbar. Every button carries its id; editor.js binds them in
                 bindToolbar(). "Toggle" tools add .active to themselves. -->
            <div class="toolbar" role="toolbar" aria-label="Drawing tools">

                <!-- Tools -->
                <div class="tool-group">
                    <button id="toolSelectBtn" class="tool-btn active" title="Select (V)" aria-label="Select tool">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                            <path d="M4 3l7 17 2.5-7.5L21 10z"></path>
                        </svg>
                    </button>
                    <!-- Brushes dropdown: fabric's built-in brushes (editor.js
                         configureFreehandBrush). Pencil strokes are Paths,
                         marker/spray are dot groups, patterns carry their
                         texture. editor.js mirrors the chosen icon onto
                         #brushIconHolder and lights the button while armed. -->
                    <div class="tool-dropdown-menu">
                        <button id="toolDrawBtn" class="tool-btn" title="Brushes" aria-label="Brush tools">
                            <span id="brushIconHolder" class="tool-btn-icon"></span>
                        </button>
                        <div id="brushDropdown" class="tool-dropdown">
                            <button class="tool-dropdown-item" data-tool="draw" title="Pencil (P)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                                    <path d="m15 5 4 4"></path>
                                </svg>
                                Pencil <kbd>P</kbd>
                            </button>
                            <button class="tool-dropdown-item" data-tool="marker" title="Marker (M)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m9 11-6 6v3h9l3-3"></path>
                                    <path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path>
                                </svg>
                                Marker <kbd>M</kbd>
                            </button>
                            <button class="tool-dropdown-item" data-tool="spray" title="Spray (S)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 3h.01"></path><path d="M7 5h.01"></path><path d="M11 7h.01"></path>
                                    <path d="M3 7h.01"></path><path d="M7 9h.01"></path><path d="M3 11h.01"></path>
                                    <rect width="4" height="4" rx="1" x="15" y="5"></rect>
                                    <path d="m19 9 2 2v10c0 .6-.4 1-1 1h-6c-.6 0-1-.4-1-1V11l2-2"></path>
                                </svg>
                                Spray <kbd>S</kbd>
                            </button>
                            <button class="tool-dropdown-item" data-tool="dots" title="Dots pattern brush">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                                    <circle cx="5" cy="5" r="1.6"></circle><circle cx="12" cy="5" r="1.6"></circle><circle cx="19" cy="5" r="1.6"></circle>
                                    <circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle>
                                    <circle cx="5" cy="19" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle><circle cx="19" cy="19" r="1.6"></circle>
                                </svg>
                                Dots
                            </button>
                            <button class="tool-dropdown-item" data-tool="stripes" title="Stripes pattern brush">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                    <line x1="9" y1="21" x2="21" y2="9"></line>
                                    <line x1="3" y1="15" x2="15" y2="3"></line>
                                    <line x1="13" y1="21" x2="21" y2="13"></line>
                                </svg>
                                Stripes
                            </button>
                        </div>
                    </div>
                    <!-- Eraser: fabric.EraserBrush from the extensions bundle -->
                    <button id="toolEraserBtn" class="tool-btn" title="Eraser (E)" aria-label="Eraser tool">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
                            <path d="M22 21H7"></path>
                            <path d="m5 11 9 9"></path>
                        </svg>
                    </button>
                    <button id="toolTextBtn" class="tool-btn" title="Text (T)" aria-label="Text tool">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 7 4 4 20 4 20 7"></polyline>
                            <line x1="9" y1="20" x2="15" y2="20"></line>
                            <line x1="12" y1="4" x2="12" y2="20"></line>
                        </svg>
                    </button>
                    <!-- Shapes dropdown: picks the insert tool (rect/ellipse/
                         triangle/line/arrow). editor.js mirrors the chosen icon
                         onto #shapeIconHolder and lights the button while armed. -->
                    <div class="tool-dropdown-menu">
                        <button id="toolShapeBtn" class="tool-btn" title="Shapes" aria-label="Shapes">
                            <span id="shapeIconHolder" class="tool-btn-icon"></span>
                        </button>
                        <div id="shapeDropdown" class="tool-dropdown">
                            <button class="tool-dropdown-item" data-tool="rect" title="Rectangle (R)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="2"></rect></svg>
                                Rectangle <kbd>R</kbd>
                            </button>
                            <button class="tool-dropdown-item" data-tool="ellipse" title="Ellipse (O)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8" ry="6.5"></ellipse></svg>
                                Ellipse <kbd>O</kbd>
                            </button>
                            <button class="tool-dropdown-item" data-tool="triangle" title="Triangle">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4l9 16H3z"></path></svg>
                                Triangle
                            </button>
                            <button class="tool-dropdown-item" data-tool="line" title="Line (L)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"></line></svg>
                                Line <kbd>L</kbd>
                            </button>
                            <button class="tool-dropdown-item" data-tool="arrow" title="Arrow (A)">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="18" y2="6"></line><polyline points="11 6 18 6 18 13"></polyline></svg>
                                Arrow <kbd>A</kbd>
                            </button>
                        </div>
                    </div>
                    <!-- editor.js: click -> imageFileInput.click(); on change,
                         FileReader.readAsDataURL -> fabric.Image.fromURL,
                         dropped at the viewport center -->
                    <button id="imageBtn" class="tool-btn" title="Insert image" aria-label="Insert image">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>
                    <input type="file" id="imageFileInput" accept="image/*" class="hidden">
                </div>

                <span class="toolbar-sep"></span>

                <!-- Text properties (enabled when an IText is selected) -->
                <div class="tool-group">
                    <select id="fontFamilySelect" class="tool-select" title="Font"
                            aria-label="Font family">
                        <option value="Inter" selected>Inter</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Trebuchet MS">Trebuchet MS</option>
                    </select>
                    <input type="number" id="fontSizeInput" class="tool-input tool-input-num"
                           min="8" max="200" value="20" title="Font size" aria-label="Font size">
                    <button id="textBoldBtn" class="tool-btn tool-btn-text" title="Bold (Ctrl+B)" aria-label="Bold"><strong>B</strong></button>
                    <button id="textItalicBtn" class="tool-btn tool-btn-text tool-btn-italic" title="Italic (Ctrl+I)" aria-label="Italic"><em>I</em></button>
                </div>

                <span class="toolbar-sep"></span>

                <!-- Appearance: stroke / fill / stroke width / opacity -->
                <div class="tool-group">
                    <label class="tool-color" title="Stroke color">
                        <input type="color" id="strokeColorInput" value="#1f2937" aria-label="Stroke color">
                    </label>
                    <label class="tool-color" title="Fill color">
                        <input type="color" id="fillColorInput" value="#94a3b8" aria-label="Fill color">
                    </label>
                    <input type="number" id="strokeWidthInput" class="tool-input tool-input-num"
                           min="1" max="60" value="2" title="Stroke width" aria-label="Stroke width">
                    <input type="range" id="opacityInput" class="tool-range"
                           min="0" max="100" step="1" value="100" title="Opacity" aria-label="Opacity">
                </div>

                <span class="toolbar-sep"></span>

                <!-- Canvas colour: the board is DOCUMENT data (saved as
                     drawing.background, seeded #ffffff at createDrawing).
                     It deliberately does NOT follow the light/dark theme, so
                     ink chosen against it stays legible across switches. -->
                <div class="tool-group">
                    <label class="tool-color" title="Canvas color">
                        <input type="color" id="canvasColorInput" value="#ffffff" aria-label="Canvas color">
                    </label>
                </div>

                <span class="toolbar-sep"></span>

                <!-- Arrange: z-order + grouping dropdown, duplicate/delete flat.
                     The whole group disables with no selection via
                     deleteBtn.closest('.tool-group'). -->
                <div class="tool-group">
                    <div class="tool-dropdown-menu">
                        <button id="arrangeBtn" class="tool-btn" title="Arrange" aria-label="Arrange objects">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 20V7M8 7 5 10M8 7l3 3"></path>
                                <path d="m16 4v13m0 0 3-3m-3 3-3-3"></path>
                            </svg>
                        </button>
                        <div id="arrangeDropdown" class="tool-dropdown">
                            <button id="bringForwardBtn" class="tool-dropdown-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M4 16V6a2 2 0 0 1 2-2h10"></path>
                                </svg>
                                Bring forward
                            </button>
                            <button id="sendBackwardBtn" class="tool-dropdown-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="4" y="4" width="12" height="12" rx="2"></rect><path d="M20 8v10a2 2 0 0 1-2 2H8"></path>
                                </svg>
                                Send backward
                            </button>
                            <div class="tool-dropdown-divider"></div>
                            <button id="groupBtn" class="tool-dropdown-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><path d="M10 6.5h7.5V14M14 17.5H6.5V10"></path>
                                </svg>
                                Group <kbd>Ctrl+G</kbd>
                            </button>
                            <button id="ungroupBtn" class="tool-dropdown-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7" rx="1" stroke-dasharray="2 2"></rect><rect x="14" y="14" width="7" height="7" rx="1" stroke-dasharray="2 2"></rect><path d="M10 6.5h4M6.5 10v4M14 17.5h-4M17.5 14v-4"></path>
                                </svg>
                                Ungroup <kbd>Ctrl+Shift+G</kbd>
                            </button>
                            <div class="tool-dropdown-divider"></div>
                            <button id="clearCanvasBtn" class="tool-dropdown-item tool-dropdown-danger">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                Clear board
                            </button>
                        </div>
                    </div>
                    <button id="duplicateBtn" class="tool-btn" title="Duplicate (Ctrl+D)" aria-label="Duplicate">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                            <rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button id="deleteBtn" class="tool-btn tool-btn-danger" title="Delete (Del)" aria-label="Delete selection">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>

                <span class="toolbar-sep"></span>

                <!-- Undo / redo -->
                <div class="tool-group">
                    <button id="undoBtn" class="tool-btn" title="Undo (Ctrl+Z)" aria-label="Undo">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 14 4 9 9 4"></polyline>
                            <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
                        </svg>
                    </button>
                    <button id="redoBtn" class="tool-btn" title="Redo (Ctrl+Y)" aria-label="Redo">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 14 20 9 15 4"></polyline>
                            <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
                        </svg>
                    </button>
                </div>

                <span class="toolbar-sep"></span>

                <!-- Zoom -->
                <div class="tool-group">
                    <button id="zoomOutBtn" class="tool-btn" title="Zoom out (Ctrl+-)" aria-label="Zoom out">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line>
                        </svg>
                    </button>
                    <button id="zoomValue" type="button" class="zoom-value" title="Actual size (Shift+0)" aria-label="Reset zoom to 100%" aria-live="polite">100%</button>
                    <button id="zoomInBtn" class="tool-btn" title="Zoom in (Ctrl+=)" aria-label="Zoom in">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line><line x1="11" y1="8" x2="11" y2="14"></line>
                        </svg>
                    </button>
                    <button id="zoomFitBtn" class="tool-btn" title="Fit to content (Ctrl+0)" aria-label="Fit to content">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Canvas stage. fabric.Canvas mounts on #drawCanvas and FILLS
                 the stage — the board is infinite; editor.js pans/zooms it
                 via viewportTransform. The dot grid is the stage's CSS
                 background (scrolls with nothing — it is a static texture). -->
            <div class="canvas-stage">
                <canvas id="drawCanvas"></canvas>
            </div>
        </section>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>Loading Draw...</p>
    </div>

    <!-- Notification toast (showNotification() in editor.js writes here) -->
    <div id="notification" class="notification"></div>

    <!-- Key Info Modal -->
    <div id="keyModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Your Access Key</h3>
                <button class="key-modal-close" id="keyModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <div class="key-display-container">
                    <div class="key-display">
                        <span class="key-text" id="keyText">-</span>
                        <button class="key-copy-btn" id="keyCopyBtn" title="Copy key">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <p class="key-copy-feedback" id="keyCopyFeedback"></p>
                </div>
                <button class="key-modal-close-btn" id="keyModalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Delete Account Confirmation Modal -->
    <div id="deleteAccountModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Delete Account</h3>
                <button class="key-modal-close" id="deleteAccountModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <p>
                    Are you sure you want to delete your account? This action cannot be undone.
                </p>
                <div class="modal-actions">
                    <button id="cancelDeleteAccount" class="btn">Cancel</button>
                    <button id="confirmDeleteAccount" class="btn btn-danger">Delete Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename Modal (click the drawing title to open) -->
    <div id="renameModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Rename drawing</h3>
                <button class="key-modal-close" id="renameModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <input type="text" id="renameInput" class="rename-input" placeholder="Drawing name..."
                    maxlength="100" autocomplete="off" />
                <div class="modal-actions">
                    <button id="renameCancelBtn" class="btn">Cancel</button>
                    <button id="renameConfirmBtn" class="btn btn-primary">Rename</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename Reminder Modal -->
    <div id="renamePromptModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Add a name?</h3>
                <button class="key-modal-close" id="renamePromptClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <input type="text" id="renamePromptInput" class="rename-prompt-input" placeholder="Drawing name..."
                    maxlength="100" autocomplete="off" />
                <div class="rename-prompt-actions">
                    <button id="renamePromptLater" class="rename-prompt-btn rename-prompt-btn-secondary">Later</button>
                    <button id="renamePromptConfirm" class="rename-prompt-btn rename-prompt-btn-primary">Rename</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="share-modal-overlay">
        <div class="share-modal">
            <div class="share-modal-header">
                <h3 class="share-modal-title">Share Drawing</h3>
                <button class="share-modal-close-btn" id="shareModalClose" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="share-modal-body">
                <div class="share-modal-info">
                    <span class="share-modal-label">Sharing:</span>
                    <span class="share-modal-name" id="shareDrawingName">Untitled Drawing</span>
                </div>

                <div class="share-modal-url-section">
                    <div class="share-modal-url-container">
                        <input type="text" id="shareUrlInput" readonly class="share-modal-url-input">
                        <button id="copyShareUrlBtn" class="share-modal-copy-btn" title="Copy link">
                            <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            <svg class="check-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            <span class="copy-text" id="copyButtonText">Copy</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="share-modal-footer">
                <button class="share-modal-done-btn" id="shareModalCloseBtn">Done</button>
            </div>
        </div>
    </div>

    <!-- Authentication Check — Draw has NO login page of its own:
         Workdeck's login wrote the session mirrors. No session or no
         drawing id -> back to Workdeck. localStorage is checked as a fallback:
         Safari doesn't copy sessionStorage into new tabs, so a fresh tab
         would otherwise bounce straight back to '/' (mobile bug).
         config.js's helpers repeat this fallback once scripts load. -->
    <script>
        (function() {
            function readSession(name) {
                try {
                    return sessionStorage.getItem(name) || localStorage.getItem(name) || null;
                } catch (err) {
                    return null;   // storage blocked -> treat as logged out
                }
            }

            const userHash = readSession('draw_user_hash');
            const userKey = readSession('draw_user_key');
            const drawingId = new URLSearchParams(window.location.search).get('id');

            if (!userHash || !userKey) {
                window.location.href = '/';
            } else if (!drawingId) {
                window.location.href = '/';
            }
            // Session is verified against the API by drawStorage.loadUserData()
        })();
    </script>

    <!-- Custom JavaScript (plain script tags, no modules).
         Load order matters: config -> auth -> storage -> themes -> editor. -->
    <script src="config/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
