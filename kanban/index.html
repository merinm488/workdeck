<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <title>Kanban - Boards</title>
    <meta name="description" content="Kanban boards with columns, swimlanes, labels and checklists. Part of Workdeck.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2563eb">

    <!-- App Icons (shared with the rest of Workdeck) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- DHTMLX Kanban (GPL v2, UMD) — board widget -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dhtmlx/kanban@1.7.3/dist/kanban.css">
    <script src="https://cdn.jsdelivr.net/npm/@dhtmlx/kanban@1.7.3/dist/kanban.js"></script>

    <!-- Custom CSS (loaded after the widget so theme overrides win) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="top-nav-left">
            <button id="homeBtn" class="top-nav-btn" aria-label="Back" title="Back">
                <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 id="pageTitle" class="page-title">My Boards</h1>
        </div>

        <!-- Search (drops to a second row on phones via #boardsSearchToggle) -->
        <div id="listsSearchBar" class="lists-search lists-nav-control">
            <svg class="lists-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="listsSearchInput" class="lists-search-input" placeholder="Search boards" autocomplete="off">
            <button id="listsSearchClear" class="lists-search-clear hidden" aria-label="Clear search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div class="top-nav-right">
            <button id="boardsSearchToggle" class="top-nav-btn home-search-toggle lists-nav-control" type="button" aria-label="Search" title="Search">
                <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <button id="newBoardBtn" class="btn btn-primary home-new-btn lists-nav-control" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span class="btn-label">New Board</span>
            </button>
            <div class="top-nav-settings">
                <button id="settingsBtn" class="top-nav-btn" aria-label="Settings">
                    <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <div id="settingsDropdown" class="settings-dropdown">
                    <div class="theme-dropdown-container">
                        <button class="settings-dropdown-item" id="themeToggleBtn">
                            <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <span class="item-text" id="themeText">Theme: Dark</span>
                            <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 5l7 7-7 7"></path>
                            </svg>
                        </button>
                        <div class="theme-submenu" id="themeSubmenu">
                            <button class="theme-option" data-theme="dark">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                </svg>
                                <span>Dark</span>
                                <svg class="theme-check" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                </svg>
                            </button>
                            <button class="theme-option" data-theme="light">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                </svg>
                                <span>Light</span>
                                <svg class="theme-check" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                </svg>
                            </button>
                            <button class="theme-option" data-theme="system">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                </svg>
                                <span>System</span>
                                <svg class="theme-check" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="settings-dropdown-item" id="viewKeyBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                        <span class="item-text">View My Key</span>
                    </button>
                    <div class="settings-dropdown-divider"></div>
                    <button class="settings-dropdown-item text-red-600" id="deleteAccountBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                        <span class="item-text">Delete Account</span>
                    </button>
                    <button class="settings-dropdown-item" id="logoutBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span class="item-text">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="kanban-main">
        <!-- Boards view -->
        <div id="boardsView">
            <div class="lists-toolbar">
                <h2>Your boards</h2>
            </div>
            <div id="boardsGrid" class="lists-grid"></div>
            <div id="boardsNoResults" class="empty-state hidden">
                <svg class="empty-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <p>No boards match your search</p>
                <button class="btn" id="clearListsSearchBtn">Clear Search</button>
            </div>
            <div id="boardsEmpty" class="empty-state hidden">
                <svg class="empty-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                </svg>
                <p>No boards yet!</p>
                <button class="btn btn-primary" id="emptyNewBoardBtn">Create Your First Board</button>
            </div>
        </div>

        <!-- Board view (one board) -->
        <div id="boardView" class="hidden">
            <div id="boardToolbar" class="board-toolbar"></div>
            <div id="boardRoot" class="board-root"></div>
        </div>
    </main>

    <!-- Status footer -->
    <footer class="app-footer">
        <span id="kanbanFooterStats" class="app-footer-stats"></span>
    </footer>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>Loading Kanban...</p>
    </div>

    <!-- Notification toast -->
    <div id="notification" class="notification"></div>

    <!-- Key Info Modal -->
    <div id="keyModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Your Access Key</h3>
                <button class="key-modal-close" id="keyModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <div class="key-display-container">
                    <div class="key-display">
                        <span class="key-text" id="keyText">-</span>
                        <button class="key-copy-btn" id="keyCopyBtn" title="Copy key">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <p class="key-copy-feedback" id="keyCopyFeedback">Copied!</p>
                </div>
                <button class="key-modal-close-btn" id="keyModalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Delete Account Confirmation Modal -->
    <div id="deleteAccountModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Delete Account</h3>
                <button class="key-modal-close" id="deleteAccountModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <p>
                    Are you sure you want to delete your account? This cannot be undone.
                </p>
                <div class="modal-actions">
                    <button id="cancelDeleteAccount" class="btn">Cancel</button>
                    <button id="confirmDeleteAccount" class="btn btn-danger">Delete Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Name Modal (new board / rename board) -->
    <div id="nameModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title" id="nameModalTitle">New Board</h3>
                <button class="key-modal-close" id="nameModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <input type="text" id="nameModalInput" class="modal-input" placeholder="Board name..."
                       maxlength="100" autocomplete="off">
                <div class="modal-actions">
                    <button id="cancelNameModal" class="btn">Cancel</button>
                    <button id="confirmNameModal" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal (delete board) -->
    <div id="confirmModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title" id="confirmTitle">Are you sure?</h3>
                <button class="key-modal-close" id="confirmModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <p id="confirmMessage">This cannot be undone.</p>
                <div class="modal-actions">
                    <button id="cancelConfirm" class="btn">Cancel</button>
                    <button id="confirmAction" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checklist Modal -->
    <div id="checklistModal" class="key-modal">
        <div class="key-modal-content checklist-modal-content">
            <div class="key-modal-header">
                <div>
                    <h3 class="key-modal-title">Checklist</h3>
                    <p class="checklist-card-title" id="checklistCardTitle"></p>
                </div>
                <button class="key-modal-close" id="checklistModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <div class="checklist-progress-row">
                    <progress id="checklistProgress" class="checklist-progress" max="100" value="0"></progress>
                    <span id="checklistStats" class="checklist-stats"></span>
                </div>
                <div id="checklistItems" class="checklist-items"></div>
                <div class="checklist-add-row">
                    <input type="text" id="checklistNewItem" class="modal-input" placeholder="Add an item..."
                           maxlength="200" autocomplete="off">
                    <button id="checklistAddBtn" class="btn btn-primary" type="button">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checklist item row -->
    <template id="checklistItemTemplate">
        <div class="checklist-item">
            <input type="checkbox" class="checklist-check" aria-label="Mark item done">
            <input type="text" class="checklist-text" maxlength="200" autocomplete="off">
            <button class="kb-icon-btn danger checklist-delete" title="Delete item" aria-label="Delete item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            </button>
        </div>
    </template>

    <!-- WIP Limit Modal -->
    <div id="wipLimitModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">WIP Limit — <span id="wipLimitColumn"></span></h3>
                <button class="key-modal-close" id="wipLimitModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <input type="number" id="wipLimitInput" class="modal-input" min="1" max="99"
                       placeholder="Max cards (empty = no limit)" autocomplete="off">
                <div class="modal-actions">
                    <button id="cancelWipLimit" class="btn">Cancel</button>
                    <button id="confirmWipLimit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Board card -->
    <template id="kbBoardCardTemplate">
        <div class="kb-board-card" role="button" tabindex="0">
            <div class="kb-board-card-head">
                <span class="kb-board-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                        <line x1="15" y1="3" x2="15" y2="21"></line>
                    </svg>
                </span>
                <span class="kb-board-name"></span>
            </div>
            <span class="kb-board-meta"></span>
            <div class="kb-board-card-actions">
                <button class="kb-icon-btn kb-board-rename" title="Rename" aria-label="Rename">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                        <path d="m15 5 4 4"></path>
                    </svg>
                </button>
                <button class="kb-icon-btn danger kb-board-delete" title="Delete" aria-label="Delete">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Authentication Check Script -->
    <script>
        // Kanban has NO login page: Workdeck's login already wrote the
        // session mirrors. No session -> back to Workdeck.
        (function() {
            try {
                const userHash = sessionStorage.getItem('kanban_user_hash') ||
                    localStorage.getItem('kanban_user_hash');
                const userKey = sessionStorage.getItem('kanban_user_key') ||
                    localStorage.getItem('kanban_user_key');

                if (!userHash || !userKey) {
                    window.location.href = '/';
                }
            } catch (err) {
                window.location.href = '/';
            }
            // Session is verified against the API by kanbanStorage.loadUserData()
        })();
    </script>

    <!-- Custom JavaScript -->
    <script src="config/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/board.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
