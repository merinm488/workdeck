<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <title>Workdeck Site</title>
    <meta name="description" content="A site published with Workdeck.">
    <meta name="theme-color" content="#4F46E5">

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- The app's own stylesheet: the site is the Workdeck home page,
         read-only, so it wears the exact same shell -->
    <link rel="stylesheet" href="/workdeck.css">
    <link rel="stylesheet" href="/blog.css">

    <!-- Markdown rendering (same package as the landing page previews) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

    <!-- form-js viewer: read-only rendering of published forms -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@bpmn-io/form-js@1.25.0/dist/assets/form-js.css">
    <script src="https://cdn.jsdelivr.net/npm/@bpmn-io/form-js@1.25.0/dist/form-viewer.umd.js"></script>
</head>
<body>
    <!-- ===== LOADING / ERROR (no site data yet, so no shell chrome) ===== -->
    <div id="blogLoading" class="blog-loading">
        <div class="blog-spinner"></div>
        <p>Loading site…</p>
    </div>

    <div id="blogError" class="blog-error hidden">
        <div class="blog-error-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <h1 id="blogErrorTitle">Site not found</h1>
        <p id="blogErrorText">This address is not published.</p>
        <button id="blogRetryBtn" class="blog-btn-outline">Retry</button>
    </div>

    <!-- ===== SITE (the Workdeck home view, read-only) ===== -->
    <div id="blogApp" class="wd-home-view hidden">
        <!-- Background decoration -->
        <div class="wd-background">
            <div class="wd-bg-circle wd-bg-circle-top-right"></div>
            <div class="wd-bg-circle wd-bg-circle-bottom-left"></div>
        </div>

        <!-- Sidebar: pinned on desktop, drawer + scrim on smaller screens -->
        <div id="sidebarScrim" class="wd-sidebar-scrim" aria-hidden="true"></div>
        <aside id="sidebar" class="wd-sidebar" aria-label="Site sections">
            <button id="sidebarClose" class="wd-side-close" aria-label="Close sidebar" title="Close sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div class="wd-side-brand">
                <div id="blogBrand" class="wd-logo" role="button" tabindex="0" title="All files">
                    <div class="wd-logo-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 01-1-1h4a1 1 0 001 1v4a1 1 0 001 1h3a1 1 0 001-1V10" />
                        </svg>
                    </div>
                    <span id="siteBrand" class="wd-logo-text"></span>
                </div>
                <!-- App chooser + All files pill (same as the app's sidebar) -->
                <div class="wd-side-filters">
                    <div class="wd-filter-chooser" id="filterChooser">
                        <button id="filterChooserBtn" class="wd-filter wd-filter-chooser-btn" aria-haspopup="menu" aria-expanded="false">
                            <span class="wd-filter-chooser-icon hidden" id="filterChooserIcon"></span>
                            <span id="filterChooserLabel">Apps</span>
                            <svg class="wd-new-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div id="filterDropdown" class="wd-dropdown">
                            <!-- Items rendered by JS from the published kinds -->
                        </div>
                    </div>
                    <button class="wd-filter active" data-filter="all">All files</button>
                </div>
            </div>
            <nav class="wd-sidebar-scroll">
                <!-- All files -->
                <div id="allFilesBtn" class="wd-side-row" role="button" tabindex="0" title="All files">
                    <svg class="wd-side-row-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <span class="wd-side-row-name">All files</span>
                </div>

                <!-- Tags (read-only: no add/edit/delete) -->
                <div id="siteTagsSection" class="hidden">
                    <div class="wd-side-header">
                        <h2 class="wd-side-title">Tags</h2>
                    </div>
                    <!-- Tag rows rendered by renderSidebar() in blog.js -->
                    <div id="projectList"></div>
                </div>
            </nav>
        </aside>

        <main class="wd-container">
            <!-- Header -->
            <header class="wd-header">
                <div class="wd-header-content">
                    <!-- Sidebar toggle: hamburger (drawer) below 1024px, panel toggle on desktop -->
                    <button id="sidebarToggle" class="wd-icon-btn wd-sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false" title="Toggle sidebar">
                        <svg class="wd-icon-panel" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <path d="M9 3v18"></path>
                        </svg>
                        <svg class="wd-icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>

                    <!-- Search -->
                    <div class="wd-search-container">
                        <div class="wd-search-wrapper">
                            <svg class="wd-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input
                                type="text"
                                id="searchInput"
                                placeholder="Search"
                                class="wd-search-input"
                            >
                            <div id="searchGhost" class="wd-search-ghost" aria-hidden="true"><span id="searchGhostTyped"></span><span id="searchGhostRest"></span></div>
                            <button id="clearSearch" class="wd-search-clear hidden" aria-label="Clear search">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Actions: settings carries the theme menu only — the
                         visitor has no account actions here -->
                    <div class="wd-actions">
                        <div class="wd-settings-container">
                            <button id="settingsBtn" class="wd-icon-btn" aria-label="Settings">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </button>
                            <div id="settingsDropdown" class="wd-dropdown wd-dropdown-right">
                                <div class="wd-theme-container">
                                    <button class="wd-dropdown-item" id="themeToggleBtn">
                                        <svg class="wd-item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="5"></circle>
                                            <line x1="12" y1="1" x2="12" y2="3"></line>
                                            <line x1="12" y1="21" x2="12" y2="23"></line>
                                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                            <line x1="1" y1="12" x2="3" y2="12"></line>
                                            <line x1="21" y1="12" x2="23" y2="12"></line>
                                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                                        </svg>
                                        <span class="wd-item-text" id="themeText">Theme: Dark</span>
                                        <svg class="wd-dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                    </button>
                                    <div id="themeSubmenu" class="wd-theme-submenu">
                                        <button class="wd-theme-option" data-theme="dark">
                                            <svg class="wd-theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                            </svg>
                                            <span>Dark</span>
                                            <svg class="wd-theme-check" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                            </svg>
                                        </button>
                                        <button class="wd-theme-option" data-theme="light">
                                            <svg class="wd-theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                            </svg>
                                            <span>Light</span>
                                            <svg class="wd-theme-check" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                            </svg>
                                        </button>
                                        <button class="wd-theme-option" data-theme="system">
                                            <svg class="wd-theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                            </svg>
                                            <span>System</span>
                                            <svg class="wd-theme-check" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Home content (hidden while a file's read-only view is open) -->
            <div id="blogHome">
                <!-- Filter bar: view toggle -->
                <div class="wd-filter-bar">
                    <div class="wd-view-toggle" id="viewToggle" role="group" aria-label="Switch between grid and list view">
                        <button class="wd-view-btn active" data-view="grid" aria-label="Grid view" title="Grid view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                        <button class="wd-view-btn" data-view="list" aria-label="List view" title="List view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Section title -->
                <div class="wd-view-indicator">
                    <h1 id="viewTitle" class="wd-view-title">Recent files</h1>
                    <span id="viewCount" class="wd-view-count"></span>
                    <span id="searchHint" class="wd-search-hint hidden">in search results</span>
                </div>

                <!-- Files -->
                <div id="filesGrid" class="wd-files-grid"></div>
                <div id="filesList" class="wd-files-list hidden"></div>

                <!-- Empty State (no + New: visitors can't create) -->
                <div id="emptyState" class="wd-empty-state hidden">
                    <div class="wd-empty-icon-wrapper">
                        <svg class="wd-empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 01-1-1h4a1 1 0 001 1v4a1 1 0 001 1h3a1 1 0 001-1V10" />
                        </svg>
                    </div>
                    <h3 class="wd-empty-title">Nothing here yet</h3>
                    <p class="wd-empty-description"></p>
                </div>
            </div>

            <!-- Read-only file views (doc / sheet / deck / form) mount here -->
            <div id="blogDetail"></div>
        </main>

        <!-- Status footer: live stats like the app's, plus the site badge -->
        <footer class="wd-footer">
            <div class="wd-footer-inner">
                <a class="blog-footer-badge" href="/" title="Made with Workdeck">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 01-1-1h4a1 1 0 001 1v4a1 1 0 001 1h3a1 1 0 001-1V10" /></svg>
                    <span>Powered by Workdeck</span>
                </a>
                <span id="wdFooterStats" class="wd-footer-stats"></span>
            </div>
        </footer>
    </div>

    <!-- ===== TEMPLATES ===== -->

    <!-- App icons — wdIcon(name) clones #wd-icon-<name> (kind icon keys) -->
    <template id="wd-icon-docs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
    </template>
    <template id="wd-icon-sheets">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M3 14h18m-9-4v8m-7-6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2v-8a2 2 0 012-2z" /></svg>
    </template>
    <template id="wd-icon-forms">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"></path><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><line x1="9" y1="12" x2="15" y2="12"></line><line x1="9" y1="16" x2="13" y2="16"></line></svg>
    </template>
    <template id="wd-icon-slides">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><line x1="12" y1="17" x2="12" y2="21"></line><line x1="8" y1="21" x2="16" y2="21"></line></svg>
    </template>
    <template id="wd-icon-filter-check">
        <svg class="wd-filter-check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </template>

    <!-- Sidebar tag row (blog.js: renderSidebar) — no edit/delete actions -->
    <template id="blogSideTagTemplate">
        <div class="wd-side-row wd-project-row">
            <span class="wd-dot"></span>
            <span class="wd-side-row-name"></span>
            <span class="wd-side-count"></span>
        </div>
    </template>

    <!-- App entry for the filter chooser dropdown (blog.js: buildAppMenuItem) -->
    <template id="wdDropdownItemTemplate">
        <button class="wd-dropdown-item">
            <span class="wd-app-icon"></span>
            <div class="wd-dropdown-item-text">
                <span class="wd-dropdown-item-title"></span>
            </div>
        </button>
    </template>

    <!-- File card, grid view (blog.js: buildCard) — no action buttons -->
    <template id="wdFileCardTemplate">
        <div class="wd-file-card">
            <div class="wd-file-card-top">
                <div class="wd-file-icon"></div>
                <div class="wd-file-title"></div>
            </div>
            <div class="wd-file-preview"><div class="wd-file-preview-page">
                <div class="wd-preview-skeleton"></div>
            </div></div>
            <div class="wd-file-meta">
                <span class="wd-file-app-badge"></span>
                <span class="wd-file-date"></span>
            </div>
        </div>
    </template>

    <!-- File row, list view (blog.js: buildListRow) — no action buttons -->
    <template id="wdFileRowTemplate">
        <div class="wd-file-row">
            <div class="wd-file-icon"></div>
            <div class="wd-file-row-main">
                <div class="wd-file-row-title"></div>
            </div>
            <span class="wd-file-app-badge"></span>
            <div class="wd-file-row-meta"></div>
        </div>
    </template>

    <!-- Offscreen fabric frame doc (verbatim srcdoc text) — previews.js
         frameSrcdoc() swaps __FABRIC_SRC__ / __KIND__ -->
    <textarea id="wdPreviewFrameDoc" hidden>
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <script src="__FABRIC_SRC__"></script>
</head>
<body>
    <script>
async function render(job) {
  try { await document.fonts.load("400 20px Inter"); await document.fonts.load("700 20px Inter"); } catch (e) {}
  const el = document.createElement("canvas");
  if (job.kind === "slides") {
    const canvas = new fabric.StaticCanvas(el, { width: job.w, height: job.h });
    await canvas.loadFromJSON({ objects: job.objects || [] });
    canvas.backgroundColor = job.background || "#ffffff";
    canvas.renderAll();
    const multiplier = Math.max(0.3, Math.min(2, ((job.outW || 600) * (job.dpr || 1)) / job.w));
    return canvas.toDataURL({ format: "png", multiplier: multiplier });
  }
  const outW = job.outW || 300;
  const outH = Math.round(outW * 0.625);
  const canvas = new fabric.StaticCanvas(el, { width: outW, height: outH });
  await canvas.loadFromJSON({ objects: job.objects || [] });
  canvas.backgroundColor = job.background || "#ffffff";
  canvas.renderAll();
  const objs = canvas.getObjects();
  if (objs.length) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    objs.forEach(function (o) {
      const r = o.getBoundingRect();
      minX = Math.min(minX, r.left); minY = Math.min(minY, r.top);
      maxX = Math.max(maxX, r.left + r.width); maxY = Math.max(maxY, r.top + r.height);
    });
    const bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);
    const scale = Math.min((outW * 0.9) / bw, (outH * 0.9) / bh, 2);
    canvas.setViewportTransform([scale, 0, 0, scale,
      outW / 2 - (minX + bw / 2) * scale, outH / 2 - (minY + bh / 2) * scale]);
    canvas.renderAll();
  }
  return canvas.toDataURL({ format: "png", multiplier: Math.max(1, Math.min(3, job.dpr || 1)) });
}
window.addEventListener("message", async function (e) {
  const data = e.data || {};
  if (!data.jobId) return;
  try {
    const dataUrl = await render(data.job);
    parent.postMessage({ jobId: data.jobId, dataUrl: dataUrl }, "*");
  } catch (err) {
    parent.postMessage({ jobId: data.jobId, error: String(err) }, "*");
  }
});
parent.postMessage({ previewReady: true, kind: "__KIND__" }, "*");
    </script>
</body>
