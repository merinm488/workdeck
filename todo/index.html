<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <title>Todo - Task Lists</title>
    <meta name="description" content="Create task lists with due dates and priorities. Part of Workdeck.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#188038">

    <!-- App Icons (shared with the rest of Workdeck) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- SortableJS (MIT, UMD) — drag/drop task reordering -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="top-nav-left">
            <button id="homeBtn" class="top-nav-btn" aria-label="Back" title="Back">
                <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 id="pageTitle" class="page-title">My Lists</h1>
        </div>

        <div class="top-nav-right">
            <div class="top-nav-settings">
                <button id="settingsBtn" class="top-nav-btn" aria-label="Settings">
                    <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <div id="settingsDropdown" class="settings-dropdown">
                    <div class="theme-dropdown-container">
                        <button class="settings-dropdown-item" id="themeToggleBtn">
                            <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <span class="item-text" id="themeText">Theme: Light</span>
                            <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 5l7 7-7 7"></path>
                            </svg>
                        </button>
                        <div class="theme-submenu" id="themeSubmenu">
                            <button class="theme-option" data-theme="dark">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                </svg>
                                <span>Dark</span>
                                <svg class="theme-check" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                </svg>
                            </button>
                            <button class="theme-option" data-theme="light">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                </svg>
                                <span>Light</span>
                                <svg class="theme-check" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                </svg>
                            </button>
                            <button class="theme-option" data-theme="system">
                                <svg class="theme-option-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                </svg>
                                <span>System</span>
                                <svg class="theme-check" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button class="settings-dropdown-item" id="viewKeyBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                        <span class="item-text">View My Key</span>
                    </button>
                    <div class="settings-dropdown-divider"></div>
                    <button class="settings-dropdown-item text-red-600" id="deleteAccountBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                        <span class="item-text">Delete Account</span>
                    </button>
                    <button class="settings-dropdown-item" id="logoutBtn">
                        <svg class="item-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span class="item-text">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="todo-main">
        <!-- Lists view -->
        <div id="listsView">
            <div class="lists-toolbar">
                <h2>Your task lists</h2>
                <button id="newListBtn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New List
                </button>
            </div>
            <div id="listsGrid" class="lists-grid"></div>
            <div id="listsEmpty" class="empty-state hidden">
                <svg class="empty-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 17 2 2 4-4"></path>
                    <path d="m3 7 2 2 4-4"></path>
                    <path d="M13 6h8"></path>
                    <path d="M13 12h8"></path>
                    <path d="M13 18h8"></path>
                </svg>
                <p>No task lists yet!</p>
                <button class="btn btn-primary" id="emptyNewListBtn">Create Your First List</button>
            </div>
        </div>

        <!-- List view (one task list) -->
        <div id="listView" class="hidden">
            <div class="nav-tabs" role="tablist" aria-label="Task views">
                <button id="navAdd" class="nav-tab active" role="tab" aria-selected="true">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    Add Task
                </button>
                <button id="navList" class="nav-tab" role="tab" aria-selected="false">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 17 2 2 4-4"></path>
                        <path d="m3 7 2 2 4-4"></path>
                        <path d="M13 6h8"></path>
                        <path d="M13 12h8"></path>
                        <path d="M13 18h8"></path>
                    </svg>
                    Task List
                    <span id="taskCount" class="task-count">0</span>
                </button>
            </div>

            <!-- Add Task -->
            <div id="addView">
                <form id="todoForm" class="todo-form">
                    <div class="form-group">
                        <label for="todoTitle">Title</label>
                        <input type="text" class="text-input" id="todoTitle" name="title"
                               placeholder="Enter your task..." maxlength="200" required>
                    </div>

                    <div class="form-group">
                        <label for="todoDescription">Description (optional)</label>
                        <textarea id="todoDescription" name="description" rows="2"
                                  placeholder="Add more details about this task..." maxlength="2000"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="todoDate">Due Date</label>
                            <input type="date" id="todoDate" name="dueDate">
                        </div>

                        <div class="form-group">
                            <label for="todoPriority">Priority</label>
                            <div class="select-wrap">
                                <select id="todoPriority" name="priority">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Task
                    </button>
                </form>
            </div>

            <!-- Task List -->
            <div id="taskListView" class="hidden">
                <div id="emptyState" class="empty-state hidden">
                    <svg class="empty-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <line x1="9" y1="12" x2="15" y2="12"></line>
                        <line x1="9" y1="16" x2="13" y2="16"></line>
                    </svg>
                    <p>No tasks yet!</p>
                    <button class="btn btn-primary" id="emptyAddTaskBtn">Add Your First Task</button>
                </div>
                <div id="todoList" class="todo-list"></div>
            </div>
        </div>
    </main>

    <!-- Status footer -->
    <footer class="app-footer">
        <span id="todoFooterStats" class="app-footer-stats"></span>
    </footer>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p>Loading Todo...</p>
    </div>

    <!-- Notification toast -->
    <div id="notification" class="notification"></div>

    <!-- Key Info Modal -->
    <div id="keyModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Your Access Key</h3>
                <button class="key-modal-close" id="keyModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <div class="key-display-container">
                    <div class="key-display">
                        <span class="key-text" id="keyText">-</span>
                        <button class="key-copy-btn" id="keyCopyBtn" title="Copy key">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </div>
                    <p class="key-copy-feedback" id="keyCopyFeedback">Copied!</p>
                </div>
                <button class="key-modal-close-btn" id="keyModalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Delete Account Confirmation Modal -->
    <div id="deleteAccountModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Delete Account</h3>
                <button class="key-modal-close" id="deleteAccountModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <p>
                    Are you sure you want to delete your account? This cannot be undone.
                </p>
                <div class="modal-actions">
                    <button id="cancelDeleteAccount" class="btn">Cancel</button>
                    <button id="confirmDeleteAccount" class="btn btn-danger">Delete Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Rename List Modal -->
    <div id="renameListModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Rename List</h3>
                <button class="key-modal-close" id="renameListModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <input type="text" id="renameListInput" class="modal-input" placeholder="List name..."
                       maxlength="100" autocomplete="off">
                <div class="modal-actions">
                    <button id="cancelRenameList" class="btn">Cancel</button>
                    <button id="confirmRenameList" class="btn btn-primary">Rename</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal (delete list / delete task) -->
    <div id="confirmModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title" id="confirmTitle">Are you sure?</h3>
                <button class="key-modal-close" id="confirmModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <p id="confirmMessage">This cannot be undone.</p>
                <div class="modal-actions">
                    <button id="cancelConfirm" class="btn">Cancel</button>
                    <button id="confirmAction" class="btn btn-danger">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editTaskModal" class="key-modal">
        <div class="key-modal-content">
            <div class="key-modal-header">
                <h3 class="key-modal-title">Edit Task</h3>
                <button class="key-modal-close" id="editTaskModalClose">&times;</button>
            </div>
            <div class="key-modal-body">
                <form id="editForm" class="edit-form">
                    <input type="hidden" id="editId">

                    <div class="form-group">
                        <label for="editTitle">Task Title</label>
                        <input type="text" id="editTitle" maxlength="200" required>
                    </div>

                    <div class="form-group">
                        <label for="editDescription">Description</label>
                        <textarea id="editDescription" rows="2" maxlength="2000"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editDate">Due Date</label>
                            <input type="date" id="editDate">
                        </div>

                        <div class="form-group">
                            <label for="editPriority">Priority</label>
                            <div class="select-wrap">
                                <select id="editPriority">
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancelEdit" class="btn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- List card -->
    <template id="tdListCardTemplate">
        <div class="td-list-card" role="button" tabindex="0">
            <div class="td-list-card-head">
                <span class="td-list-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 17 2 2 4-4"></path>
                        <path d="m3 7 2 2 4-4"></path>
                        <path d="M13 6h8"></path>
                        <path d="M13 12h8"></path>
                        <path d="M13 18h8"></path>
                    </svg>
                </span>
                <span class="td-list-name"></span>
            </div>
            <span class="td-list-meta"></span>
            <div class="td-list-card-actions">
                <button class="td-icon-btn td-list-rename" title="Rename" aria-label="Rename">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                        <path d="m15 5 4 4"></path>
                    </svg>
                </button>
                <button class="td-icon-btn danger td-list-delete" title="Delete" aria-label="Delete">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Task row -->
    <template id="tdTaskTemplate">
        <div class="todo-item">
            <div class="todo-checkbox">
                <input type="checkbox" class="td-task-check" aria-label="Mark task complete">
            </div>
            <div class="todo-content">
                <span class="todo-title"></span>
                <span class="todo-description hidden"></span>
                <div class="todo-meta">
                    <span class="todo-date hidden">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span class="td-date-text"></span>
                    </span>
                    <span class="priority-badge medium"></span>
                </div>
            </div>
            <div class="todo-actions">
                <button class="td-icon-btn td-task-edit" title="Edit" aria-label="Edit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                        <path d="m15 5 4 4"></path>
                    </svg>
                </button>
                <button class="td-icon-btn danger td-task-delete" title="Delete" aria-label="Delete">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <!-- Authentication Check Script -->
    <script>
        // Todo has NO login page of its own: Workdeck's login already wrote
        // the session mirrors. No session -> back to Workdeck.
        (function() {
            try {
                const userHash = sessionStorage.getItem('todo_user_hash') ||
                    localStorage.getItem('todo_user_hash');
                const userKey = sessionStorage.getItem('todo_user_key') ||
                    localStorage.getItem('todo_user_key');

                if (!userHash || !userKey) {
                    window.location.href = '/';
                }
            } catch (err) {
                window.location.href = '/';
            }
            // Session is verified against the API by todoStorage.loadUserData()
        })();
    </script>

    <!-- Custom JavaScript -->
    <script src="config/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
