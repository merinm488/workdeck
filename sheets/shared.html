<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <!-- SEO Meta Tags -->
    <title>Shared Spreadsheet - View with Sheets</title>
    <meta name="description" content="View a shared spreadsheet using Sheets - the modern Excel alternative. No account required to view shared spreadsheets.">
    <meta name="keywords" content="shared spreadsheet, view spreadsheet, excel alternative view, data sharing, grid view">
    <meta name="author" content="Sheets">
    <meta name="robots" content="noindex, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Shared Spreadsheet - View with Sheets">
    <meta property="og:description" content="View a shared spreadsheet using Sheets - the modern Excel alternative.">
    <meta property="og:image" content="https://workdeck-amber-tau.vercel.app/icons/app-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="628">
    <meta property="og:image:alt" content="Sheets Shared Spreadsheet Preview">
    <meta property="og:site_name" content="Sheets">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Shared Spreadsheet - View with Sheets">
    <meta name="twitter:description" content="View a shared spreadsheet using Sheets - the modern Excel alternative.">
    <meta name="twitter:image" content="https://workdeck-amber-tau.vercel.app/icons/app-preview.png">

    <!-- Additional SEO -->
    <meta name="theme-color" content="#4F46E5">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sheets">

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/sheets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/sheets/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/sheets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/sheets/manifest.json">

    <!-- Structured Data for Shared Page -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sheets",
      "description": "View shared spreadsheets with Sheets modern Excel alternative"
    }
    </script>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Univer Spreadsheet (react/rxjs prerequisites load before presets) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
    <script src="https://unpkg.com/@univerjs/presets@0.25.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-filter@0.25.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-sort@0.25.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.25.1/lib/umd/locales/en-US.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-filter@0.25.1/lib/umd/locales/en-US.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-sort@0.25.1/lib/umd/locales/en-US.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/preset-sheets-core@0.25.1/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/presets@0.25.1/lib/styles/preset-sheets-filter.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/presets@0.25.1/lib/styles/preset-sheets-sort.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="top-nav-left">
            <button id="homeBtn" class="top-nav-btn" aria-label="Close" title="Close">
                <svg class="top-nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-yellow-400/10 dark:bg-white/10 flex items-center justify-center">
                    <svg class="w-4 h-4 text-yellow-500 dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </div>
                <h1 class="spreadsheet-title" id="sharedSpreadsheetTitle">Shared Spreadsheet</h1>
            </div>
        </div>

        <div class="top-nav-right">
            <span class="shared-badge">Publicly Shared</span>
        </div>
    </nav>

    <!-- Spreadsheet Container -->
    <div id="univer" class="univer-container"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Loading Shared Spreadsheet...</p>
    </div>

    <!-- Error Overlay -->
    <div id="errorOverlay" class="loading-overlay hidden">
        <div class="error-container">
            <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h2>Shared Spreadsheet Not Found</h2>
            <p>This shared spreadsheet may have been deleted or the link is invalid.</p>
            <button id="closeErrorBtn" class="home-cancel-btn">Close</button>
        </div>
    </div>

    <!-- Univer JS is loaded in <head> (react/rxjs must precede presets) -->

    <!-- Legacy-format notice (shared.js: showLegacyNotice) -->
    <template id="legacyNoticeTemplate">
        <div class="legacy-notice">
            <div class="legacy-notice-card">
                <div class="legacy-notice-icon">📊</div>
                <h2>Created with an older version of Sheets</h2>
                <p>This shared spreadsheet was made with the previous Sheets engine and can no longer be displayed here.</p>
                <p class="legacy-banner">The owner's data is safe and untouched.</p>
            </div>
        </div>
    </template>

    <!-- Fatal: spreadsheet library failed to load (shared.js entry point) -->
    <template id="univerFailTemplate">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
            <h2>Failed to load spreadsheet library</h2>
            <p>Please check your internet connection and refresh the page.</p>
        </div>
    </template>

    <!-- Custom JavaScript -->
    <script src="config/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/shared.js"></script>

    <!-- PWA Script -->
    <script src="js/pwa.js"></script>
</body>
</html>
