    <!-- Authentication Check Script -->
    <script>
        // Check if user is authenticated before loading the app
        (function() {
            const userHash = sessionStorage.getItem('sheets_user_hash');
            const userKey = sessionStorage.getItem('sheets_user_key');
            const urlParams = new URLSearchParams(window.location.search);
            const spreadsheetId = urlParams.get('id');

            if (!userHash || !userKey) {
                // No session found, redirect to login
                window.location.href = '/sheets/';
            } else if (!spreadsheetId) {
                // Authenticated but no spreadsheet ID, redirect to home
                window.location.href = '/sheets/home.html';
            }
            // Session will be verified by authManager.initialize()
        })();
    </script>
